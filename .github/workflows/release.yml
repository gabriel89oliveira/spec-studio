name: Release do aplicativo (Windows)

# Cada push na main (um merge, por exemplo) gera a próxima versão de patch:
# v0.1.7 → v0.1.8. Para pular para outra versão (v0.2.0), crie e envie a tag à mão:
#   git tag -a v0.2.0 -m "Spec Studio 0.2.0" && git push origin v0.2.0
# Os merges seguintes continuam a partir dela (v0.2.1, v0.2.2…).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # cria a tag e a release neste repositório

# Dois merges seguidos não disputam o mesmo número de versão.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Testa antes de criar a tag: um merge que quebra os testes não vira versão.
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/main'
        with:
          node-version: 22
          cache: npm
      - name: Testes
        if: github.ref == 'refs/heads/main'
        run: npm ci && npm test
      - name: Define a tag desta versão
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::notice::Versões automáticas saem só da main ou de uma tag v*; nada a fazer em $GITHUB_REF_NAME."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          # Este commit já tem tag (criada à mão): a release sai pelo push da própria tag.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "O commit já tem tag; nada a fazer."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Spec Studio ${next#v}"
          git push origin "$next"
          echo "Nova tag: $next (anterior: $last)"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  windows:
    needs: versao
    if: needs.versao.outputs.tag != ''
    runs-on: windows-latest
    env:
      TAG: ${{ needs.versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependências do projeto
        run: npm ci
      - name: Testes
        run: npm test
      - name: Dependências do aplicativo
        working-directory: desktop
        run: npm ci
      - name: Versão a partir da tag
        shell: bash
        run: echo "SPEC_STUDIO_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Monta a pasta do aplicativo
        working-directory: desktop
        run: npm run stage
      - name: Dependências de produção (traz o executável do Claude para Windows)
        working-directory: desktop/stage
        run: npm install --omit=dev --no-audit --no-fund
      - name: Gera o instalador e publica a release neste repositório
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: certificado de assinatura de código (.pfx em base64) e senha
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish always
